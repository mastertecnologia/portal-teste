# Sintaxe PHP 7.4 — validação sem servidor local (GitHub Actions).
# Acionável manualmente; também corre em PR/push quando toca ficheiros listados.
name: PHP syntax (7.4)

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**/*.php"
      - "config/**/*.php"
      - "src/Template/**/*.ctp"
      - "composer.json"
      - "composer.lock"
      - ".github/workflows/php-syntax-check.yml"
  push:
    branches:
      - main
    paths:
      - "src/**/*.php"
      - "config/**/*.php"
      - "src/Template/**/*.ctp"
      - "composer.json"
      - "composer.lock"
      - ".github/workflows/php-syntax-check.yml"

concurrency:
  group: php-syntax-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          extensions: intl, mbstring
          coverage: none

      - name: Lint — ficheiros do fix Financeiro/CORS
        run: |
          set -e
          php -l src/Model/Table/FinanceiroBancosTable.php
          php -l src/Utility/ErpIntegrationRequest.php

      - name: Lint — src e config (PHP)
        run: |
          set -e
          find src config -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Lint — templates (.ctp)
        run: |
          set -e
          find src/Template -name "*.ctp" -print0 | xargs -0 -n1 php -l

      - name: Composer validate
        run: composer validate --no-check-publish
