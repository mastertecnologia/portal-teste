# Virtual Hosts
#
# Required modules: mod_log_config

# If you want to maintain multiple domains/hostnames on your
# machine you can setup VirtualHost containers for them. Most configurations
# use only name-based virtual hosts so the server doesn't need to worry about
# IP addresses. This is indicated by the asterisks in the directives below.
#
# Please see the documentation at 
# <URL:http://httpd.apache.org/docs/2.4/vhosts/>
# for further details before you try to setup virtual hosts.
#
# You may use the command line option '-S' to verify your virtual host
# configuration.

#
# Use name-based virtual hosting.
#
##NameVirtualHost *:80
#
# VirtualHost example:
# Almost any Apache directive may go into a VirtualHost container.
# The first VirtualHost section is used for all requests that do not
# match a ##ServerName or ##ServerAlias in any <VirtualHost> block.
#
##<VirtualHost *:80>
    ##ServerAdmin webmaster@dummy-host.example.com
    ##DocumentRoot "C:/xampp/htdocs/dummy-host.example.com"
    ##ServerName dummy-host.example.com
    ##ServerAlias www.dummy-host.example.com
    ##ErrorLog "logs/dummy-host.example.com-error.log"
    ##CustomLog "logs/dummy-host.example.com-access.log" common
##</VirtualHost>

##<VirtualHost *:80>
    ##ServerAdmin webmaster@dummy-host2.example.com
    ##DocumentRoot "C:/xampp/htdocs/dummy-host2.example.com"
    ##ServerName dummy-host2.example.com
    ##ErrorLog "logs/dummy-host2.example.com-error.log"
    ##CustomLog "logs/dummy-host2.example.com-access.log" common
##</VirtualHost>

<VirtualHost portal.pgm.inf.br:80>
    ServerAdmin darli@mastertecnologia.inf.br
    DocumentRoot "C:/xampp/htdocs/portal"
    ServerName portal.pgm.inf.br
    ErrorLog "logs/dummy-portal-pgm-inf-br-error.log"
    CustomLog "logs/dummy-portal-pgm-inf-br-access.log" common

    <Directory "C:/xampp/htdocs/portal">
        AllowOverride All
        Require all granted
        Options Indexes FollowSymLinks
        SetEnv SECURITY_SALT "COLOQUE_SEU_SALT_REAL_AQUI"
        SetEnv DB_HOST "localhost"
        SetEnv DB_PORT "5432"
        SetEnv DB_USERNAME "postgres"
        SetEnv DB_PASSWORD "COLOQUE_SENHA_DO_BANCO_AQUI"
        SetEnv DB_DATABASE "pgm"
        SetEnv DEBUG "false"
        SetEnv MAIL_MASTER_HOST "mail.pgm.inf.br"
        SetEnv MAIL_MASTER_PORT "587"
        SetEnv MAIL_MASTER_USERNAME "helpdesk@pgm.inf.br"
        SetEnv MAIL_MASTER_PASSWORD "COLOQUE_SENHA_EMAIL_AQUI"
        SetEnv MAIL_MASTER_TLS "false"
        SetEnv MAIL_PGM_HOST "mail.pgm.inf.br"
        SetEnv MAIL_PGM_PORT "587"
        SetEnv MAIL_PGM_USERNAME "helpdesk@pgm.inf.br"
        SetEnv MAIL_PGM_PASSWORD "COLOQUE_SENHA_EMAIL_AQUI"
        SetEnv MAIL_PGM_TLS "false"
    </Directory>
</VirtualHost>

<VirtualHost portal.pgm.inf.br:443>
    ServerAdmin darli@mastertecnologia.inf.br
    SSLEngine On
    SSLCertificateFile "C:/xampp/apache/conf/ssl.crt/certificate.crt"
    SSLCertificateKeyFile "C:/xampp/apache/conf/ssl.key/private.key"
    DocumentRoot "C:/xampp/htdocs/portal"
    ServerName portal.pgm.inf.br
    ErrorLog "logs/dummy-portal-pgm-inf-br-error.log"
    CustomLog "logs/dummy-portal-pgm-inf-br-access.log" common

    <Directory "C:/xampp/htdocs/portal">
        AllowOverride All
        Require all granted
        Options Indexes FollowSymLinks
        SetEnv SECURITY_SALT "COLOQUE_SEU_SALT_REAL_AQUI"
        SetEnv DB_HOST "localhost"
        SetEnv DB_PORT "5432"
        SetEnv DB_USERNAME "postgres"
        SetEnv DB_PASSWORD "COLOQUE_SENHA_DO_BANCO_AQUI"
        SetEnv DB_DATABASE "pgm"
        SetEnv DEBUG "false"
        SetEnv MAIL_MASTER_HOST "mail.pgm.inf.br"
        SetEnv MAIL_MASTER_PORT "587"
        SetEnv MAIL_MASTER_USERNAME "helpdesk@pgm.inf.br"
        SetEnv MAIL_MASTER_PASSWORD "COLOQUE_SENHA_EMAIL_AQUI"
        SetEnv MAIL_MASTER_TLS "false"
        SetEnv MAIL_PGM_HOST "mail.pgm.inf.br"
        SetEnv MAIL_PGM_PORT "587"
        SetEnv MAIL_PGM_USERNAME "helpdesk@pgm.inf.br"
        SetEnv MAIL_PGM_PASSWORD "COLOQUE_SENHA_EMAIL_AQUI"
        SetEnv MAIL_PGM_TLS "false"
    </Directory>
</VirtualHost>
