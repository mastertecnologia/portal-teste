<!DOCTYPE html>
<html lang="pt-BR" data-pgm-theme="dark">
<head>
	<meta charset="utf-8" />
	<!--
		Caminho público do portal (igual a APP_BASE no .env, ex.: /portal).
		Deixe content vazio se o app estiver na raiz do host (URLs começam em /dist/...).
		No deploy: alinhe com SetEnv APP_BASE no Apache ou com o prefixo real do virtual host.
	-->
	<meta name="pgm-app-base" content="" />
	<script>
	(function () {
		var m = document.querySelector('meta[name="pgm-app-base"]');
		var raw = (m && m.getAttribute('content')) ? String(m.getAttribute('content')).trim() : '';
		var path = raw;
		if (!path) {
			path = '/';
		} else {
			if (path.charAt(0) !== '/') {
				path = '/' + path;
			}
			if (path.length > 1 && path.slice(-1) !== '/') {
				path += '/';
			}
		}
		var b = document.createElement('base');
		b.setAttribute('href', path);
		document.head.insertBefore(b, document.head.firstChild);
	})();
	</script>
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<title>We've got some trouble | {{code}} - {{title}}</title>

	<link rel="stylesheet" href="dist/css/pages/pgm-theme-tokens.css" />
	<link rel="stylesheet" href="dist/css/pages/pgm-components-base.css" />
	<link rel="stylesheet" href="dist/css/pages/pgm-error-http.css" />
	<script>
	(function () {
		try {
			localStorage.setItem('pgmPortalTheme', 'dark');
		} catch (e) {}
		document.documentElement.setAttribute('data-pgm-theme', 'dark');
	})();
	</script>
</head>

<body class="pgm-error-http">
	<div class="cover">
		<h1>{{title}} <small>Error {{code}}</small></h1>
		<p class="lead">{{message}}</p>
	</div>
</body>
</html>
