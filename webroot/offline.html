<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<title>Offline — PGM ERP</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<style>
		body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #f2f1ee; color: #1a1a18; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
		.box { background: #fff; border-radius: 16px; padding: 48px 36px; max-width: 480px; text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
		.icon { font-size: 64px; margin-bottom: 18px; }
		h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
		p { color: #6b6a65; font-size: 13px; line-height: 1.6; margin: 0 0 20px; }
		button { padding: 10px 24px; background: #1D9E75; color: #fff; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 500; }
		button:hover { background: #0F6E56; }
	</style>
</head>
<body>
	<div class="box">
		<div class="icon">📡</div>
		<h1>Você está offline</h1>
		<p>Sem conexão com o portal PGM agora. Verifique sua internet e tente novamente.</p>
		<button onclick="location.reload()">🔄 Tentar de novo</button>
	</div>
</body>
</html>
